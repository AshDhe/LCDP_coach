<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Accueil espace coach - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <script src="../config.js"></script>
  <script>
  (()=>{
    const c=window.SITE_CONFIG||{};
    const root=String(c.objetBaseUrl||c.OBJET_BASE||((c.publicBaseUrl||'').replace(/\/+$/,'')+'/OBJET')).replace(/\/+$/,'');
    window.SITE_BASE=c.coachBaseUrl||'';
    for (const path of ['/CSSBASE/cssbase.css','/BOX/02-box-bandeau-nav.css','/BOX/01-box-text.css','/BOX/02-box-menu-burger.css','/BOX/02-box-alerte.css','/BOX/02-box-footer.css','/BOX/02-box-menu-bouton.css','/BOX/pictowait.css']) document.write('<link rel="stylesheet" href="'+root+path+'">');
  })();
  </script>
</head>
<body class="lcdp-page-accueil-coach">
  <div id="lcdp-accueil-attente" class="lcdp-pictowait" role="status" aria-label="Chargement de votre espace coach">
    <img class="lcdp-pictowait__image" alt="" width="64" height="64" id="lcdp-chargement-logo">
  </div>
  <div class="lcdp-site-page">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main">
      <section class="lcdp-page-section">
        <div class="lcdp-page-container">
          <div id="lcdp-accueil-erreur" hidden role="alert">
            <p>Impossible de charger votre espace coach.</p>
            <button type="button" class="lcdp-button lcdp-button-primary" onclick="window.location.reload()">Réessayer</button>
          </div>
          <noscript>Activez JavaScript pour accéder à votre espace coach.</noscript>
          <div id="lcdp-accueil-contenu" class="lcdp-page-content lcdp-stack-large" hidden aria-busy="true">
            <div class="lcdp-accueil-intro">
              <p class="lcdp-text-strong-lead lcdp-accueil-mention">Bonjour, c’est à vous.</p>
            </div>
            
            <div id="lcdp-menu-central-slot" class="lcdp-stack"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
  <script>
  (()=>{
    const c=window.SITE_CONFIG||{};
    const u=typeof c.objetUrl==='function'?c.objetUrl('/BOX/pictowait.gif'):(String(c.objetBaseUrl||c.OBJET_BASE||'').replace(/\/+$/,'')+'/BOX/pictowait.gif');
    document.getElementById('lcdp-chargement-logo').src=u;
  })();
  </script>
  <script src="./accueil-coach.js"></script>
  
</body>
</html>
