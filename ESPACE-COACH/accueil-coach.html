<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Accueil espace COACH - La Clé du Parc</title>

  <link rel="icon" type="image/png" href="../favicon-32x32.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accueil de votre espace COACH La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.SITE_CONFIG || {};

      function nettoyerBaseUrl(value) {
        return String(value || "").replace(/\/+$/, "");
      }

      function buildUrl(base, path) {
        return nettoyerBaseUrl(base) + "/" + String(path || "").replace(/^\/+/, "");
      }

      const membreBase = nettoyerBaseUrl(
        config.membreBaseUrl ||
        config.MEMBRE_BASE ||
        config.siteBase ||
        ""
      );

      const publicBase = nettoyerBaseUrl(
        config.publicBaseUrl ||
        config.PUBLIC_BASE ||
        ""
      );

      const objetBase = nettoyerBaseUrl(
        config.objetBaseUrl ||
        config.OBJET_BASE ||
        buildUrl(publicBase, "/OBJET")
      );

      window.SITE_BASE = nettoyerBaseUrl(config.coachBaseUrl || config.COACH_BASE || config.siteBase || "");
      window.LCDP_ESPACE_BASE = window.SITE_BASE;
      window.LCDP_MEMBRE_BASE = membreBase;
      window.LCDP_PUBLIC_BASE = publicBase;
      window.LCDP_OBJET_BASE = objetBase;

      window.LCDP_urlPublic = function LCDP_urlPublic(path) {
        if (typeof config.publicUrl === "function") {
          return config.publicUrl(path);
        }

        return buildUrl(publicBase, path);
      };

      window.LCDP_urlMembre = function LCDP_urlMembre(path) {
        if (typeof config.membreUrl === "function") {
          return config.membreUrl(path);
        }

        return buildUrl(membreBase, path);
      };

      window.LCDP_urlObjet = function LCDP_urlObjet(path) {
        if (typeof config.objetUrl === "function") {
          return config.objetUrl(path);
        }

        return buildUrl(objetBase, path);
      };

      const feuillesCssObjet = [
        "/CSSBASE/cssbase.css",
        "/CSSBASE/lcdp-central-mobile-first.css",
      ];

      feuillesCssObjet.forEach((chemin) => {
        document.write(
          '<link rel="stylesheet" href="' +
          window.LCDP_urlObjet(chemin) +
          '">'
        );
      });
    })();
  </script>

  <!-- Règles existantes copiées sans modification depuis accueil-membre.html : attente et pictogrammes. -->
  <style>
    #lcdp-accueil-contenu[hidden], #lcdp-accueil-erreur[hidden] { display: none !important; }
    /* Attente initiale : couvre la fenêtre dès le premier affichage. */
    #lcdp-accueil-attente {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10000;
      box-sizing: border-box;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0 !important;
      padding: 0 !important;
      align-items: center;
      justify-content: center;
      background: var(--lcdp-color-surface, #fff);
    }
    #lcdp-accueil-attente > img {
      display: block;
      flex: 0 0 64px;
      width: 64px;
      height: 64px;
      margin: 0;
    }

    /* Attente de navigation : superposition centrée, sans déplacer les boutons. */
    #lcdp-navigation-attente:not([hidden]) {
      position: fixed;
      inset: 0;
      z-index: 10000;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      box-sizing: border-box;
      background: var(--lcdp-color-surface, #fff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* L'indicateur est toujours au centre du viewport, pas du contenu de page. */
    #lcdp-navigation-attente .lcdp-pictowait__image {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      margin: 0 !important;
      max-width: none;
    }
    #lcdp-navigation-attente[hidden] {
      display: none !important;
    }
  </style>
  <style id="lcdp-pictos-accueil-membre">
    .lcdp-page-accueil-membre #lcdp-menu-central-slot,
    .lcdp-page-accueil-membre #lcdp-menu-central-slot > *,
    .lcdp-page-accueil-membre #lcdp-menu-central-slot .lcdp-accueil-actions {
      width: 100%;
      min-width: 0;
    }

    .lcdp-page-accueil-membre .lcdp-accueil-actions > button.lcdp-accueil-picto {
      box-sizing: border-box;
      width: 148.68px;
      max-width: 100%;
      flex-shrink: 0;
      height: 112px;
      min-height: 112px;
      margin-inline: auto;
      padding: 8px 16px;
      flex-direction: column;
      gap: 4px;
      color: #ffffff;
    }
    .lcdp-accueil-picto > svg,
    .lcdp-accueil-picto > img {
      display: block;
      max-width: none;
      min-width: 71.68px;
      width: 71.68px;
      height: 71.68px;
      flex: 0 0 71.68px;
      object-fit: contain;
    }
    .lcdp-accueil-picto > img {
      filter: brightness(0) invert(1);
      transform: scale(1.15);
    }
    .lcdp-accueil-picto > span {
      font-size: clamp(11.95488px, 3.6064vw, 16.4864px);
      transform: scaleX(0.95);
      line-height: 1.05;
      white-space: nowrap;
    }
    @media (min-width: 768px) {
      .lcdp-page-accueil-membre .lcdp-accueil-actions > button.lcdp-accueil-picto {
        width: 194.88px;
        height: 120px;
        min-height: 120px;
      }
      .lcdp-accueil-picto > svg,
      .lcdp-accueil-picto > img {
        min-width: 76.16px;
        width: 76.16px;
        height: 76.16px;
        flex-basis: 76.16px;
      }
      .lcdp-accueil-picto > span {
        font-size: 15.088px;
      }
    }
  </style>
</head>

<body class="lcdp-page-accueil-membre lcdp-page-accueil-coach">
  <div id="lcdp-accueil-attente" role="status" aria-label="Chargement de votre espace COACH" style="display:flex">
            <script>document.write('<img src="' + window.LCDP_urlObjet('/IMAG/PICTO/pictowait.gif') + '" alt="" width="64" height="64">');</script>
          </div>
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>


    <main class="lcdp-site-main">
      <section class="lcdp-page-section">
        <div class="lcdp-page-container">

          <div id="lcdp-accueil-erreur" hidden role="alert">
            <p>Impossible de charger votre espace COACH.</p>
            <button type="button" class="lcdp-button lcdp-button-primary" onclick="window.location.reload()">Réessayer</button>
          </div>
          <noscript>Activez JavaScript pour accéder à votre espace COACH.</noscript>
          <div id="lcdp-accueil-contenu" class="lcdp-page-content lcdp-stack-large" hidden aria-busy="true">

            <div class="lcdp-accueil-intro">
              <p class="lcdp-text-strong-lead lcdp-accueil-mention" id="message-accueil-coach" aria-live="polite">
                Bonjour, c’est à vous.
              </p>

              <p class="lcdp-mention-connexion" id="mention-statut-membre" aria-live="polite">
                
              </p>
            </div>

            <div id="lcdp-menu-central-slot" class="lcdp-stack"></div>
            <div id="lcdp-navigation-attente" class="lcdp-pictowait" hidden role="status" aria-live="polite">
              <script>document.write('<img class="lcdp-pictowait__image" src="' + window.LCDP_urlObjet('/IMAG/PICTO/pictowait.svg') + '" alt="">');</script>
            </div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script>
    window.LCDP_echecAccueilCoach = function () {
      document.getElementById("lcdp-accueil-attente").style.display = "none";
      document.getElementById("lcdp-accueil-contenu").hidden = true;
      document.getElementById("lcdp-accueil-erreur").hidden = false;
    };
  </script>
  <script src="./accueil-coach.js" onerror="window.LCDP_echecAccueilCoach()"></script>
</body>
</html>
