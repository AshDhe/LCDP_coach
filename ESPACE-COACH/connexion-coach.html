<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Connexion coach - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Connexion à votre compte coach La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/CSSBASE/cssbase.css" data-site-href="/OBJET/CSSBASE/cssbase.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/02-box-bandeau-nav.css" data-site-href="/OBJET/BOX/02-box-bandeau-nav.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/02-box-alerte.css" data-site-href="/OBJET/BOX/02-box-alerte.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/02-box-footer.css" data-site-href="/OBJET/BOX/02-box-footer.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/03-box-formulaire.css" data-site-href="/OBJET/BOX/03-box-formulaire.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/03-box-champ-formulaire.css" data-site-href="/OBJET/BOX/03-box-champ-formulaire.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/02-box-dialogue-bouton.css" data-site-href="/OBJET/BOX/02-box-dialogue-bouton.css">
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/BOX/02-box-menu-burger.css" data-site-href="/OBJET/BOX/02-box-menu-burger.css">
  <style>
    .lcdp-connexion-coach #lcdp-bandeau-slot .lcdp-box-bandeau-nav { background: var(--lcdp-color-coach, #8660c8); }
    .lcdp-connexion-coach .lcdp-box-formulaire__title { color: var(--lcdp-color-coach, #8660c8); }
    .lcdp-connexion-coach #bouton-valider-formulaire,
    .lcdp-connexion-coach #bouton-valider-formulaire:hover,
    .lcdp-connexion-coach #bouton-valider-formulaire:focus-visible { background: var(--lcdp-color-coach, #8660c8); border-color: var(--lcdp-color-coach, #8660c8); }
  </style>
</head>

<body class="lcdp-connexion-coach">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section
        class="lcdp-page-section"
        aria-label="Connexion au compte coach"
      >
        <div class="lcdp-page-container">

          <section
            class="lcdp-component lcdp-box-formulaire-page lcdp-box-formulaire-page--compact"
            data-lcdp-box-formulaire-page
          >
            <div class="lcdp-box-formulaire-page__inner">

              <form
                id="formulaire-connexion-coach"
                method="post"
                class="lcdp-box-formulaire"
                novalidate
              >
                <header class="lcdp-box-formulaire__header">
                  <h1 class="lcdp-box-formulaire__title">
                    Connexion coach
                  </h1>

                  <p class="lcdp-box-formulaire__subtitle">
                    Accédez à votre compte coach
                  </p>
                </header>

                <div class="lcdp-box-formulaire__fields">

                  <div class="lcdp-box-champ-formulaire">
                    
                    <div class="lcdp-box-champ-formulaire__control">
                      <input
                        type="email"
                        id="emailcoach"
                        name="emailcoach"
                        aria-label="Identifiant e-mail de votre compte coach"
                        placeholder="Identifiant e-mail de votre compte coach"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                      >
                    </div>
                  </div>

                  <div class="lcdp-box-champ-formulaire">
                    
                    <div class="lcdp-box-champ-formulaire__control">
                      <input
                        type="password"
                        id="mdpcoach"
                        name="mdpcoach"
                        aria-label="Mot de passe de votre compte coach"
                        placeholder="Mot de passe de votre compte coach"
                        autocomplete="current-password"
                        required
                      >

                      <label
                        class="lcdp-box-champ-formulaire__checkbox-line"
                        for="afficher-mdp-coach"
                      >
                        <input
                          type="checkbox"
                          id="afficher-mdp-coach"
                        >
                        <span>Afficher le mot de passe</span>
                      </label>
                      <p class="lcdp-box-formulaire__note lcdp-box-formulaire__note--after-control">
                        <a
                          id="lien-mot-de-passe-oublie"
                          href="./mdp-perdu-coach.html"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          Mot de passe perdu ?
                        </a>
                      </p>
                    </div>
                  </div>

                </div>

                  <div class="lcdp-box-formulaire__actions">
                    <button
                      type="submit"
                      id="bouton-valider-formulaire"
                      class="lcdp-button-logo"
                      aria-label="Connexion"
                      title="Connexion"
                    >
                    <img
                      class="lcdp-button-logo__image"
                      src="../OBJET/IMAG/LOGO/logo-bouton-navigation-192.webp"
                      data-site-src="/OBJET/IMAG/LOGO/logo-bouton-navigation-192.webp"
                      alt=""
                      aria-hidden="true"
                    >
                      <span class="lcdp-sr-only">Connexion</span>
                    </button>
                  </div>

              </form>

            </div>
          </section>

        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script>
    (() => {
      "use strict";

      const formulaire = document.getElementById("formulaire-connexion-coach");
      const motDePasse = document.getElementById("mdpcoach");
      const afficher = document.getElementById("afficher-mdp-coach");
      if (afficher && motDePasse) {
        afficher.addEventListener("change", () => {
          motDePasse.type = afficher.checked ? "text" : "password";
        });
      }
      // Un script absent ne doit jamais envoyer les identifiants dans l'URL.
      formulaire?.addEventListener("submit", (event) => {
        if (formulaire.dataset.connexionInitialisee === "true") return;
        event.preventDefault();
        window.alert("Le formulaire de connexion n’a pas pu être chargé. Rechargez cette page.");
      });

      const siteBase = (
        window.SITE_BASE ||
        window.SITE_CONFIG?.publicBaseUrl ||
        window.SITE_CONFIG?.siteBase ||
        ""
      ).replace(/\/$/, "");

      function construireUrlSite(chemin) {
        if (!chemin) return chemin;

        if (
          chemin.startsWith("#") ||
          chemin.startsWith("mailto:") ||
          chemin.startsWith("tel:") ||
          chemin.startsWith("http://") ||
          chemin.startsWith("https://") ||
          chemin.startsWith("data:")
        ) {
          return chemin;
        }

        if (siteBase) {
          return chemin.startsWith("/")
            ? siteBase + chemin
            : siteBase + "/" + chemin.replace(/^\.\//, "");
        }

        return chemin.startsWith("/") ? ".." + chemin : chemin;
      }

      function appliquerRoutesSite(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          element.setAttribute("href", construireUrlSite(element.dataset.siteHref));
        });

        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          element.setAttribute("src", construireUrlSite(element.dataset.siteSrc));
        });
      }

      window.LCDP_construireUrlSite = construireUrlSite;
      appliquerRoutesSite(document);
    })();
  </script>
  <script src="./connexion-coach.js?v=20261031-connexion-coach-1"></script>
</body>
</html>
